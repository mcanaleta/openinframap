name: Build custom web container

on:
  push:
    branches:
      - codex/custom-map
    paths:
      - "web/**"
      - ".github/workflows/custom-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mcanaleta/openinframap-web

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint
      - name: Start development server
        run: npm start &
      - name: Wait for server
        run: npx wait-on http://localhost:5173
      - name: Run tests
        run: npm run test
      - name: Build production frontend
        run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:custom-map
